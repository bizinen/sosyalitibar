services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sosyal_itibar
      POSTGRES_USER: sosyal_itibar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosyal_itibar -d sosyal_itibar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sosyal_itibar:${POSTGRES_PASSWORD}@db:5432/sosyal_itibar
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "scripts/scheduler.mjs"]
    env_file: .env.production
    environment:
      NODE_ENV: production
      APP_INTERNAL_URL: http://app:3000
      DATABASE_URL: postgresql://sosyal_itibar:${POSTGRES_PASSWORD}@db:5432/sosyal_itibar
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-worker.mjs"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
